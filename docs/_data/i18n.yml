  process:
    title: "Herken je dit?"
    intro: "Vijf momenten uit een gewone week in de keuken."
    payoff:
      title: "Herken je dit?"
      text: "Dan is Fornelo voor jou gemaakt. Begin gratis, met 10 AI-scans per maand en zoveel recepten als je wilt."
      cta: "Gratis beginnen"
    items:
      - lead: "Dat ene recept staat in dat ene kookboek."
        questions: "Welk boek was het ook alweer? Welke pagina? En wie heeft het geleend?"
        answer: "Eén foto en het recept staat in Fornelo. Doorzoekbaar, op al je apparaten, mét de foto van de pagina erbij."
      - lead: "Die tijdschriftpagina staat in je fotorol."
        questions: "Tussen vierduizend andere foto's. Zoeken op 'nasi' helpt daar niet."
        answer: "Fornelo leest de pagina uit en maakt er een recept van. De foto zelf blijft erbij bewaard."
      - lead: "Je staat in de supermarkt."
        questions: "Wat had je ook alweer nodig voor dat recept? En hoeveel?"
        answer: "Eén tik op het recept en alles staat op de boodschappenlijst, zonder wat je toch al in huis hebt."
      - lead: "Het recept is voor vier. Jullie zijn met zes."
        questions: "Hoofdrekenen boven een pan, met een telefoon die steeds op zwart gaat."
        answer: "Schuif de porties naar zes en elke hoeveelheid rekent mee. In de kookmodus blijft het scherm aan."
      - lead: "\"Heb jij de melk gehaald?\" \"Ik dacht dat jij…\""
        questions: "Twee boodschappenlijstjes, drie telefoons, één huishouden."
        answer: "Met Familie delen jullie één lijst. Wat de een in het mandje legt, verdwijnt bij de ander van de lijst. Meteen."

  features:
    enlarge: "Vergroot"
    close: "Sluiten"
    title_prefix: "Van foto"
    title_highlight: "tot op tafel"
    intro: "Alles wat je met een recept doet, op één plek: bewaren, terugvinden, koken en boodschappen doen."
    sections:
      - eyebrow: "Scannen"
        title: "Uit {words}"
        title_words:
          - "een kookboek."
          - "een tijdschrift."
          - "een schermafbeelding."
          - "een website."
        body: "Maak een foto van de pagina, of van meerdere pagina's als het recept doorloopt. Fornelo leest de tekst, haalt het recept eruit en zet het klaar om te controleren: titel, ingrediënten met hoeveelheden, stappen, tijd, porties, keuken en tags. Jij kijkt het na en bevestigt. Cursieve opmerkingen, twee kolommen, een tweede ingrediëntenlijst: het mag."
        bullets:
          - "Gedrukte pagina's uit boeken en tijdschriften; het geeft aan hoe zeker het was"
          - "Een recept van een website: plak de link"
          - "Zelf intypen kan altijd en telt nooit als AI-scan"
        layout: "overlap"
        video:
          src: "/video/scan-nl.mp4"
          poster: "/images/fornelo/scan-poster.webp"
          alt: "Fornelo leest een pagina uit: foto's geüpload, tekst herkennen, ingrediënten en stappen herkennen, klaarzetten om te zoeken"
        images:
          - src: "/images/fornelo/web-add-review.webp"
            alt: "Het uitgelezen recept Shakshuka met feta klaar om te controleren: titel, keuken, tijd, porties en de ingrediënten naast de gescande pagina"

      - eyebrow: "Zoeken"
        title: "Zoek zoals je denkt."
        body: "Typ 'courgette zonder noten onder 30 minuten' en Fornelo begrijpt wat je bedoelt. Zoek op ingrediënt, keukengerei, tag, keuken, tijd of moeilijkheid, en zie bij elk resultaat waarom het past. Of draai het om: vink aan wat je in huis hebt en zie wat je ermee kunt maken."
        bullets:
          - "Op ingrediënt, keukengerei, tag, keuken, tijd en moeilijkheid"
          - "'Wat heb ik in huis?' zoekt vanuit je voorraad"
          - "Een zoekopdracht is een link: bewaar hem of deel hem"
        images:
          - src: "/images/fornelo/web-search.webp"
            alt: "Zoeken naar 'courgette onder 30 minuten': Fornelo leest het als hoogstens 30 minuten en vindt drie recepten"

      - eyebrow: "Koken"
        title: "Kookmodus, met timers die zichzelf zetten."
        body: "Staat er '15 minuten koken' in een stap, dan staat er een timer naast. Het scherm blijft aan, je vinkt stappen en ingrediënten af, en je schaalt de porties voordat je begint: elke hoeveelheid rekent mee. Vette vingers? Een tik op de stap is genoeg."
        bullets:
          - "Timers uit de stappen, ook meerdere tegelijk"
          - "Porties schalen, hoeveelheden rekenen mee"
          - "Grote letters met de Aa-knop, scherm blijft aan"
        images:
          - src: "/images/fornelo/web-cook.webp"
            alt: "De kookmodus: stap 1 van 4 van Shakshuka met feta, een timer van 5 minuten en de ingrediënten om af te vinken"

      - eyebrow: "Boodschappen"
        title: "Eén lijst, voor iedereen die meekookt."
        body: "Zet een recept op de boodschappenlijst en Fornelo telt de ingrediënten bij elkaar: drie uien voor twee recepten staan er één keer. Wat je altijd in huis hebt, zoals zout en olie, blijft weg. In Familie is de lijst van het hele gezin: wie afvinkt, dat zien de anderen meteen."
        bullets:
          - "Ingrediënten van meerdere recepten gecombineerd"
          - "Je basisvoorraad komt er niet op"
          - "Live gedeeld, en in de app ook zonder bereik af te vinken"
        layout: "overlap"
        images:
          - src: "/images/fornelo/web-shopping.webp"
            alt: "De boodschappenlijst met de ingrediënten van twee recepten en wat je zelf toevoegde"
          - src: "/images/fornelo/android-shopping.webp"
            alt: "Dezelfde boodschappenlijst op een Android-telefoon"
            narrow: true

    bottom_cards:
      - title: "Collecties"
        body: "Groepeer recepten zoals jij wilt: weekmenu's, kerst, snelle doordeweekse avonden. Een recept mag in meer dan één collectie."
      - title: "Delen met een link"
        body: "Stuur een recept naar iemand zonder Fornelo. Die opent de link en ziet het recept, netjes opgemaakt. Jij kunt de link altijd weer intrekken."
