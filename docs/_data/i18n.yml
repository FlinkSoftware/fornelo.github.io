    description: "Fornelo is het receptenboek dat je kookboeken en tijdschriften leest: maak een foto en het recept staat erin, doorzoekbaar, schaalbaar en op de boodschappenlijst. Voor iPhone, Android en de browser. Gratis te beginnen, met Premium en Familie voor meer AI-scans en een gedeeld receptenboek."
    category: "Receptenapp"
    features:
      - "Een foto van een kookboekpagina of tijdschrift wordt een recept: ingrediënten, stappen, tijd, porties, keuken en tags"
      - "Meerdere pagina's per recept; de uitgelezen tekst blijft bij het recept"
      - "Recepten van websites via de link, of zelf intypen (telt niet als AI-scan)"
      - "Zoeken op ingrediënt, keukengerei, tag, keuken, tijd en moeilijkheid; 'Wat heb ik in huis?'"
      - "Kookmodus: scherm blijft aan, stappen afvinken, timers uit de stappen, porties schalen"
      - "Boodschappenlijst die ingrediënten combineert, zonder je basisvoorraad; live gedeeld met je gezin"
      - "Collecties, een recept delen met een link, prullenbak"
      - "Eén receptenboek voor tot zes mensen (Familie)"
      - "Apps voor iPhone en Android, met offline lezen en koken, de documentscanner van het systeem en timers op het vergrendelscherm"
      - "Inloggen met e-mail, Google, Microsoft of Apple"
      - "Je gegevens downloaden en je account verwijderen, wanneer je wilt"
      - "Nederlands en Engels, licht en donker"

