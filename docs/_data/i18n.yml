  faq:
    title_prefix: ""
    title_highlight: "Frequently asked"
    title_suffix: "questions"
    items:
      - question: "What is Fornelo?"
        answer: "A recipe book you fill yourself, from what you already have: cookbooks, magazines, websites. You take a photo and Fornelo turns it into a recipe you can search, scale, cook and put on the shopping list. It works on your phone, tablet and computer, with one account."
        home: true
      - question: "How well does Fornelo read a photo?"
        answer: "A printed page it reads well nearly every time, two columns, notes in italics and a second ingredient list included, and Fornelo tells you how sure it was. Handwritten recipes Fornelo cannot read yet; those you type in yourself. You check every recipe before you confirm it, and the text that was read and the photo stay with the recipe, so you can always look back."
        home: true
      - question: "What is an AI scan, and what counts?"
        answer: "Every time Fornelo reads a photo or a link for you is one AI scan. A recipe with three photos is one scan. Typing a recipe in yourself never counts. Free gives you 10 a month, Premium 100 and Family 300, for the whole recipe book together."
        home: true
      - question: "Does Fornelo work on my phone?"
        answer: "Yes. There are apps for iPhone and Android, and Fornelo works in any modern browser. You sign in everywhere with the same account; what you scan on your phone is on your computer right away. The apps also keep your recipe book on the phone, so you can read and cook without signal."
        home: true
      - question: "Can my family and I share one recipe book?"
        answer: "Yes, with Family. Up to six people share one recipe book, each with their own sign-in. Recipes, collections and the shopping list are yours together, and whoever ticks something off, the others see it at once. You can keep a recipe book of your own beside it and switch with one tap."
        home: true
      - question: "How does the shopping list work?"
        answer: "Put a recipe on the list from the recipe itself, for more or fewer people if you like. Fornelo adds up the ingredients of different recipes and leaves out what is in your pantry staples, such as salt, pepper and oil. You can add loose items too. In the app you tick off without signal; as soon as you are back online, it catches up."
      - question: "Can I add recipes from websites?"
        answer: "Yes. Paste the link and Fornelo fetches the recipe, just like with a photo. It counts as one AI scan. A screenshot of a recipe works too: you scan it as a photo."
      - question: "Does it work offline?"
        answer: "In the apps for iPhone and Android: yes, reading and cooking. Your whole recipe book is on your phone, photos included, and the shopping list can be ticked off without signal. Scanning, editing and managing need a connection. In the browser a connection is always needed."
      - question: "What happens to my photos and data?"
        answer: "Your recipes and photos are yours. They live in your own recipe book and Fornelo uses them for nothing else. If you want to help improve the reading, you can switch that on; we then use the text that was read and your corrections, without photos and without data about you, and never from recipes you mark as your own or a family recipe. You can download your whole recipe book as a zip and delete your account yourself."
        home: true
      - question: "How do I pay, and can I cancel?"
        answer: "On the website, or in the app through the App Store or Google Play. A monthly or yearly subscription starts with 14 days for free; cancel in that time and you pay nothing. After that you can cancel at any time in your settings; you keep it until the end of the paid period. For good you pay once. All prices include VAT."
        home: true
      - question: "Can I share a recipe with someone without Fornelo?"
        answer: "Yes. Make a share link at the recipe and send it on. Whoever opens it sees the recipe, neatly laid out, without an account. You can withdraw the link at any time."
      - question: "How do I sign in?"
        answer: "With your e-mail address and a password, or with Google, Microsoft or Apple. You can link several ways to one account. In the app you can also lock Fornelo with Face ID, Touch ID or your fingerprint."
      - question: "Which languages is Fornelo in?"
        answer: "Dutch and English, in the apps, the browser and the e-mails. You read recipes in the language they were written in; Fornelo does not translate them."
