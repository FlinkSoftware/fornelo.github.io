            alt: "Cooking mode: step 1 of 4 of Shakshuka with feta, a 5-minute timer and the ingredients to tick off"

      - eyebrow: "Shopping"
        title: "One list, for everyone who cooks along."
        body: "Put a recipe on the shopping list and Fornelo adds the ingredients up: three onions for two recipes appear once. What you always have in, such as salt and oil, stays off. In Family the list belongs to the whole household: whoever ticks something off, the others see it at once."
        bullets:
