        title_words:
          - "a cookbook."
          - "a magazine."
          - "a screenshot."
          - "a website."
        body: "Take a photo of the page, or of several pages when the recipe runs on. Fornelo reads the text, pulls out the recipe and puts it up for checking: title, ingredients with amounts, steps, time, servings, cuisine and tags. You look it over and confirm. Notes in italics, two columns, a second ingredient list: all fine."
        bullets:
          - "Printed pages from books and magazines; it tells you how sure it was"
          - "A recipe from a website: paste the link"
          - "Typing it in yourself is always possible and never counts as an AI scan"
