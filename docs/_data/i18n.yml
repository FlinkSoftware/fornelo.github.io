      - eyebrow: "Search"
        title: "Search the way you think."
        body: "Type 'courgette without nuts under 30 minutes' and Fornelo understands what you mean. Search by ingredient, equipment, tag, cuisine, time or difficulty, and see for every result why it matches. Or turn it around: tick what you have in and see what you can make with it."
        bullets:
          - "By ingredient, equipment, tag, cuisine, time and difficulty"
          - "'What do I have in?' searches from your pantry"
          - "A search is a link: bookmark it or share it"
        images:
          - src: "/images/fornelo/en-web-search.webp"
            alt: "Searching for 'courgette under 30 minutes': Fornelo reads it as at most 30 minutes and finds three recipes"

      - eyebrow: "Cooking"
        title: "Cooking mode, with timers that set themselves."
        body: "Does a step say 'boil for 15 minutes'? Then a timer sits next to it. The screen stays on, you tick off steps and ingredients, and you scale the servings before you start: every amount follows. Greasy fingers? A tap on the step is enough."
        bullets:
          - "Timers from the steps, several at once if you like"
          - "Scale the servings, the amounts follow"
          - "Large type with the Aa button, the screen stays on"
        images:
