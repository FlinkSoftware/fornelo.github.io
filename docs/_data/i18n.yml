  faq:
    title_prefix: ""
    title_highlight: "Veelgestelde"
    title_suffix: "vragen"
    items:
      - question: "Wat is Fornelo?"
        answer: "Een receptenboek dat je zelf vult, uit wat je al hebt: kookboeken, tijdschriften, websites. Je maakt een foto en Fornelo maakt er een recept van dat je kunt doorzoeken, schalen, koken en op de boodschappenlijst zetten. Het werkt op je telefoon, tablet en computer, met één account."
        home: true
      - question: "Hoe goed leest Fornelo een foto?"
        answer: "Een gedrukte pagina leest het bijna altijd goed, ook met twee kolommen, cursieve opmerkingen of een tweede ingrediëntenlijst, en Fornelo zegt erbij hoe zeker het was. Handgeschreven recepten leest Fornelo nog niet; die typ je zelf in. Je kijkt elk recept na voordat je het bevestigt, en de uitgelezen tekst en de foto blijven bij het recept staan, zodat je altijd kunt terugkijken."
        home: true
      - question: "Wat is een AI-scan, en wat telt mee?"
        answer: "Elke keer dat Fornelo een foto of een link voor je uitleest, is één AI-scan. Een recept met drie foto's is dus één scan. Zelf een recept intypen telt nooit mee. Gratis heb je er 10 per maand, Premium 100 en Familie 300, voor het hele receptenboek samen."
        home: true
      - question: "Werkt Fornelo op mijn telefoon?"
        answer: "Ja. Er zijn apps voor iPhone en Android, en Fornelo werkt in elke moderne browser. Je logt overal in met hetzelfde account; wat je op je telefoon scant, staat meteen op je computer. De apps houden je receptenboek ook lokaal bij, zodat je zonder bereik kunt lezen en koken."
        home: true
      - question: "Kan ik samen met mijn gezin één receptenboek hebben?"
        answer: "Ja, met Familie. Tot zes mensen delen één receptenboek, ieder met een eigen inlog. Recepten, collecties en de boodschappenlijst zijn van jullie samen, en wie afvinkt, dat zien de anderen meteen. Je kunt daarnaast een eigen receptenboek houden en wisselt met één tik."
        home: true
      - question: "Hoe werkt de boodschappenlijst?"
        answer: "Zet een recept op de lijst vanaf het recept zelf, eventueel voor meer of minder personen. Fornelo telt de ingrediënten van verschillende recepten bij elkaar en laat weg wat in je basisvoorraad zit, zoals zout, peper en olie. Je kunt ook losse dingen toevoegen. In de app vink je af zonder bereik; zodra je weer verbinding hebt, loopt het gelijk."
      - question: "Kan ik recepten van websites toevoegen?"
        answer: "Ja. Plak de link en Fornelo haalt het recept op, net als bij een foto. Het telt als één AI-scan. Een schermafbeelding van een recept werkt ook: die scan je als foto."
      - question: "Werkt het offline?"
        answer: "In de apps voor iPhone en Android: ja, lezen en koken. Je hele receptenboek staat op je telefoon, met de foto's, en de boodschappenlijst is zonder bereik af te vinken. Scannen, bewerken en beheren hebben verbinding nodig. In de browser is er altijd verbinding nodig."
      - question: "Wat gebeurt er met mijn foto's en gegevens?"
        answer: "Je recepten en foto's zijn van jou. Ze staan in je eigen receptenboek en Fornelo gebruikt ze nergens anders voor. Wil je meehelpen het uitlezen te verbeteren, dan kun je dat aanzetten; dan gebruiken we de uitgelezen tekst en je correcties, zonder foto's en zonder gegevens over jou, en nooit van recepten die je als eigen of familierecept markeert. Je kunt je hele receptenboek downloaden als zip en je account zelf verwijderen."
        home: true
      - question: "Hoe betaal ik, en kan ik opzeggen?"
        answer: "Op de website, of in de app via de App Store of Google Play. Een abonnement per maand of per jaar begint met 14 dagen gratis; zeg je in die tijd op, dan betaal je niets. Daarna kun je altijd opzeggen in je instellingen; je houdt het tot het einde van de betaalde periode. Voor altijd betaal je één keer. Alle prijzen zijn inclusief btw."
        home: true
      - question: "Kan ik een recept delen met iemand zonder Fornelo?"
        answer: "Ja. Maak een deellink bij het recept en stuur die door. Wie hem opent ziet het recept, netjes opgemaakt, zonder account. Je kunt de link altijd weer intrekken."
      - question: "Hoe log ik in?"
        answer: "Met je e-mailadres en een wachtwoord, of met Google, Microsoft of Apple. Je kunt meerdere manieren aan één account koppelen. In de app kun je Fornelo daarnaast vergrendelen met Face ID, Touch ID of je vingerafdruk."
      - question: "In welke talen is Fornelo er?"
        answer: "Nederlands en Engels, in de apps, de browser en de e-mails. Recepten lees je in de taal waarin ze geschreven zijn; Fornelo vertaalt ze niet."
